name: Deploy current SEAL to Cloudflare

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - .github/workflows/deploy-current-cloudflare.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Target live SEAL worker
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const raw=fs.readFileSync(p,'utf8');
          const next=raw.replace('"name": "seal-preview"','"name": "seal"');
          if(next===raw) throw new Error('Expected seal-preview worker name in wrangler.jsonc');
          fs.writeFileSync(p,next);
          NODE
          grep -n '"name"' wrangler.jsonc

      - name: Deploy current branch to Cloudflare
        run: npm run deploy:cloudflare

      - name: Smoke-test live Worker
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://seal.imafidondavid1.workers.dev/ >/tmp/seal-home.html; then
              grep -q 'SEAL' /tmp/seal-home.html && exit 0
            fi
            sleep 5
          done
          echo "Live Worker did not become healthy within 2 minutes."
          exit 1
