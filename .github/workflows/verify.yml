name: Verify SEAL
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: npm run benchmark
      - name: Generate public sample image fixture
        run: |
          mkdir -p tests/generated
          pdftoppm -f 1 -singlefile -png -r 376 tests/fixtures/connecticut-sample-jury-summons.pdf tests/generated/connecticut-dense
          identify tests/generated/connecticut-dense.png || file tests/generated/connecticut-dense.png
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-browser-shots
          path: test-results/*.png
          if-no-files-found: ignore
      - run: npm run build
      - name: Wait for production alias
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            LIVE_SHA=$(curl -fsS https://seal-verify.vercel.app/api/version 2>/dev/null | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).sha}catch(e){''}" || true)
            echo "production sha: ${LIVE_SHA:-unavailable} / expected: $EXPECTED_SHA"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production alias did not reach the commit under test within 3 minutes."
          exit 1
      - name: Production image gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SEAL_PRODUCTION: '1'
          PLAYWRIGHT_BASE_URL: https://seal-verify.vercel.app
        run: npx playwright test tests/e2e/production.spec.ts
      - name: Upload production browser gate artifacts
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: seal-production-image-gate
          path: |
            test-results/production-*.png
          if-no-files-found: ignore
