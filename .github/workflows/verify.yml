name: Verify SEAL

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      production_smoke:
        description: 'Smoke-test the manually deployed production alias'
        required: false
        default: false
        type: boolean

concurrency:
  group: seal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verification benchmark
        run: npm run benchmark

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser reliability suite
        run: npm run e2e

      - name: Live deployed action sanity gate
        env:
          SEAL_BASE_URL: https://seal.imafidondavid1.workers.dev
        run: node --import tsx scripts/action-torture.ts

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seal-browser-artifacts
          path: |
            test-results/*.png
            test-results/*.pdf
          if-no-files-found: ignore

      # Git-triggered Vercel deployments are disabled in vercel.json.
      # Run this only after one intentional manual production deployment.
      - name: Wait for manually deployed production alias
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_smoke }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            LIVE_SHA=$(curl -fsS https://seal-verify.vercel.app/api/version 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).sha" 2>/dev/null || true)
            echo "production sha: ${LIVE_SHA:-unavailable} / expected: $EXPECTED_SHA"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production alias did not reach the manually deployed commit within 3 minutes."
          exit 1

      - name: Production browser gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_smoke }}
        env:
          SEAL_PRODUCTION: '1'
          PLAYWRIGHT_BASE_URL: https://seal-verify.vercel.app
        run: npx playwright test tests/e2e/production.spec.ts

      - name: Upload production browser artifacts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.production_smoke
        uses: actions/upload-artifact@v7
        with:
          name: seal-production-browser-gate
          path: test-results/production-*.png
          if-no-files-found: ignore
