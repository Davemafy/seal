name: Verify SEAL
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: npm run benchmark
      - name: Generate public sample image fixture
        run: |
          mkdir -p tests/generated
          pdftoppm -f 1 -singlefile -png -r 376 tests/fixtures/connecticut-sample-jury-summons.pdf tests/generated/connecticut-dense
          identify tests/generated/connecticut-dense.png || file tests/generated/connecticut-dense.png
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-browser-shots
          path: test-results/*.png
          if-no-files-found: ignore
      - run: npm run build
