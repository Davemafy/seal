<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#ffffff">
 <title>SEAL — Offline</title>
 <style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#f8f7f2;color:#0b0b0b;font-family:Arial,Helvetica,sans-serif}
  body{min-height:100vh;display:grid;place-items:center;padding:28px}
  main{width:min(520px,100%);background:#fff;border:1px solid #deddd8;border-radius:20px;padding:28px}
  img{width:34px;height:34px;display:block;margin-bottom:28px}
  h1{font-size:28px;line-height:1.05;letter-spacing:-.04em;margin:0 0 12px}
  p{font-size:16px;line-height:1.5;color:#55534f;margin:0 0 24px}
  button{appearance:none;border:0;border-radius:10px;background:#0b0b0b;color:#fff;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer}
 </style>
</head>
<body>
 <main>
  <img src="/brand/seal-app-icon-light.svg" alt="">
  <h1>SEAL needs a connection to check sources.</h1>
  <p>Your app can still open offline, but verification requires access to independent public sources. Reconnect, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
 </main>
</body>
</html>
